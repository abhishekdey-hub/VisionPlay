name: Auto Update GitHub APKs

on:
  schedule:
    # रोज़ रात 12:00 बजे (IST) अपने आप चलेगा
    - cron: '30 18 * * *'
  workflow_dispatch:
    # इससे आप जब चाहें खुद बटन दबाकर भी इसे चला सकते हैं

permissions:
  contents: write

jobs:
  update-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run APK Updater Script
        run: python scripts/update_apps.py

      - name: Commit and push if updated
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "VisionPlay Auto-Updater"
          git add _data/
          git diff --staged --quiet || git commit -m "Auto-update latest APK versions"
          git push
